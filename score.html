<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成績輸入 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
</head>
<body data-page="score">
  <main>
    <!-- 登入 -->
    <section class="card" id="loginCard">
      <h2>成績輸入登入</h2>
      <p class="muted">體育老師請用學校 <b>Google 帳號一鍵登入</b>（須先由管理員加入試算表「授權」分頁）。</p>
      <div id="gbtn"></div>
      <div id="gTip" class="muted" style="font-size:13px;margin-top:8px"></div>

      <details style="margin-top:18px">
        <summary style="cursor:pointer;font-weight:600;color:var(--gold-d)">改用管理者帳號 / 密碼登入</summary>
        <div class="grid2" style="margin-top:10px">
          <div><label>帳號 (Email)</label><input id="email" placeholder="admin@youchang" autocomplete="username"></div>
          <div><label>密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
        </div>
        <div style="margin-top:14px"><button class="btn ghost" id="loginBtn" type="button">登入</button></div>
      </details>
      <div id="loginMsg"></div>
    </section>

    <!-- 已登入後的操作區 -->
    <section class="card" id="panel" style="display:none">
      <h2>成績輸入</h2>
      <div class="row" style="justify-content:space-between">
        <div class="muted">已登入：<b id="who"></b></div>
        <button class="btn ghost" id="logoutBtn" type="button">登出</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">

      <label>選擇項目</label>
      <select id="code"><option value="">請選擇項目</option></select>

      <div id="area" style="margin-top:14px"></div>
    </section>

    <!-- 成績登錄進度總覽 -->
    <section class="card" id="progressCard" style="display:none">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">成績登錄進度</h2>
        <button class="btn ghost" id="p_refresh" type="button">重新整理</button>
      </div>
      <div id="p_out" style="margin-top:12px"><p class="muted">載入中…</p></div>
    </section>

    <!-- Excel 匯入成績 -->
    <section class="card" id="importCard" style="display:none">
      <h2>Excel 匯入成績</h2>
      <p class="muted">格式：每一列一筆成績，欄位順序 <b>項目名稱｜組別｜性別｜名次｜班級｜姓名｜紀錄</b>（第一列為標題）。
        組別填「4年級/5年級/6年級」，得分由名次自動換算，匯入為<b>附加</b>（不覆蓋原有成績）。</p>
      <div class="row">
        <button class="btn ghost" id="s_tpl" type="button">下載範例格式</button>
        <input type="file" id="s_file" accept=".xlsx,.xls,.csv" style="max-width:320px">
      </div>
      <div id="s_preview" style="margin-top:12px"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const AUTH_KEY = "yc_auth";
    let AUTH = null, EVENTS = [], REG = [];

    function loadAuth() { try { AUTH = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { AUTH = null; } }
    function saveAuth(a) { AUTH = a; localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
    function clearAuth() { AUTH = null; localStorage.removeItem(AUTH_KEY); if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); }

    /* ---- Google 一鍵登入 ---- */
    function initGoogle(tries) {
      tries = tries || 0;
      if (!CONFIG.GOOGLE_CLIENT_ID) {
        el("gTip").innerHTML = "（尚未設定 Google 登入。請見 README 設定 Client ID，或用下方管理者帳密登入。）";
        return;
      }
      if (!window.google || !google.accounts || !google.accounts.id) {
        if (tries < 20) return setTimeout(function () { initGoogle(tries + 1); }, 300);
        el("gTip").innerHTML = "（Google 登入元件載入失敗，請檢查網路，或改用下方管理者帳密。）";
        return;
      }
      google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onGoogleCred });
      google.accounts.id.renderButton(el("gbtn"),
        { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill", locale: "zh_TW", width: 280 });
    }

    async function onGoogleCred(resp) {
      el("gTip").textContent = "驗證中…";
      try {
        const res = await apiPost("googleLogin", { credential: resp.credential });
        saveAuth(res);
        el("loginMsg").innerHTML = "";
        el("gTip").textContent = "";
        showPanel();
        toast("登入成功：" + res.name, "ok");
      } catch (e) {
        el("gTip").textContent = "";
        el("loginMsg").innerHTML = '<div class="error">' + esc(e.message) + '</div>';
      }
    }

    async function login() {
      const email = el("email").value.trim(), pw = el("pw").value;
      if (!email || !pw) return toast("請輸入帳號與密碼", "err");
      const btn = el("loginBtn"); setBusy(btn, true, "登入中…");
      try {
        const res = await apiPost("login", { email, password: pw });
        saveAuth(res);
        el("loginMsg").innerHTML = "";
        showPanel();
        toast("登入成功", "ok");
      } catch (e) {
        el("loginMsg").innerHTML = '<div class="error">' + esc(e.message) + '</div>';
      } finally { setBusy(btn, false); }
    }

    function showPanel() {
      el("loginCard").style.display = "none";
      el("panel").style.display = "block";
      el("progressCard").style.display = "block";
      el("importCard").style.display = "block";
      el("who").textContent = AUTH.name + "（" + (AUTH.role === "admin" ? "管理者" : "老師") + "）";
      fillEvents();
      loadProgress();
    }

    /* ---- 成績登錄進度總覽 ---- */
    async function loadProgress() {
      const box = el("p_out");
      box.innerHTML = '<p class="muted">載入中…</p>';
      try {
        const [evD, regD, resD] = await Promise.all([apiGet("events"), apiGet("reglist"), apiGet("query")]);
        const regCount = {}, resCount = {};
        regD.regs.forEach(function (r) { const c = r["項目代碼"]; regCount[c] = (regCount[c] || 0) + 1; });
        resD.results.forEach(function (r) { const c = r["項目代碼"]; resCount[c] = (resCount[c] || 0) + 1; });
        const rows = evD.events.map(function (e) {
          const code = e["代碼"], reg = regCount[code] || 0, done = resCount[code] || 0;
          let status;
          if (done === 0) status = reg > 0 ? '<span class="rank1">⚠ 尚未登錄</span>' : '<span class="muted">尚無報名</span>';
          else if (reg && done < reg) status = '<span style="color:#8a5a10">部分登錄 (' + done + '/' + reg + ')</span>';
          else status = '<span style="color:var(--green)">✅ 已登錄</span>';
          return { code: code, name: e["名稱"], group: e["組別"], sex: e["性別"], reg: reg, done: done, status: status };
        });
        const doneN = rows.filter(function (r) { return r.done > 0; }).length;
        const trs = rows.map(function (r) {
          return `<tr><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td>${esc(r.sex)}</td>
            <td style="text-align:center">${r.reg}</td><td style="text-align:center">${r.done}</td><td>${r.status}</td></tr>`;
        }).join("");
        box.innerHTML = `<div class="notice">共 ${rows.length} 個項目，已有成績 ${doneN} 項，尚未登錄 ${rows.length - doneN} 項。</div>
          <div class="table-wrap"><table><thead><tr><th>項目</th><th>組別</th><th>性別</th><th>報名人數</th><th>已登錄</th><th>狀態</th></tr></thead>
          <tbody>${trs}</tbody></table></div>`;
      } catch (e) { box.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }

    async function fillEvents() {
      try {
        const data = await apiGet("events");
        EVENTS = data.events;
        const sel = el("code");
        sel.innerHTML = '<option value="">請選擇項目</option>';
        EVENTS.forEach(function (e) {
          const o = document.createElement("option");
          o.value = e["代碼"]; o.textContent = e["名稱"] + "（" + e["組別"] + " " + e["性別"] + "）";
          sel.appendChild(o);
        });
      } catch (e) { toast(e.message, "err"); }
    }

    async function onPickEvent() {
      const code = el("code").value, area = el("area");
      if (!code) { area.innerHTML = ""; return; }
      area.innerHTML = '<p class="muted">載入報名名單與現有成績…</p>';
      try {
        const [regData, resData] = await Promise.all([
          apiGet("registrants", { code }),
          apiGet("query", { code }),
        ]);
        REG = regData.registrants;
        renderRows(code, resData.results);
      } catch (e) { area.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }

    function renderRows(code, existing) {
      const n = CONFIG.scoreTable.length;                // 名次 1..N
      const byRank = {};
      (existing || []).forEach(r => { byRank[Number(r["名次"])] = r; });

      const opts = REG.map((r, i) => `<option value="${i}">${esc(r["班級"])} ${esc(r["姓名"])}（座${esc(r["座號"])}）</option>`).join("");
      let html = REG.length
        ? `<p class="notice">此項目共 ${REG.length} 人報名。可從下拉選擇報名者自動帶入班級/姓名，或手動輸入（大隊接力、趣味競賽請直接填班級）。</p>`
        : `<p class="notice">此項目尚無報名資料，請手動填入班級。</p>`;

      html += '<div class="table-wrap"><table><thead><tr><th>名次</th><th>選報名者</th><th>年級</th><th>班級</th><th>姓名</th><th>紀錄</th><th>得分</th></tr></thead><tbody>';
      for (let rank = 1; rank <= n; rank++) {
        const ex = byRank[rank] || {};
        html += `<tr data-rank="${rank}">
          <td class="${rank <= 3 ? "rank" + rank : ""}" style="font-weight:800">${rank}</td>
          <td><select class="pick"><option value="">— 手動 —</option>${opts}</select></td>
          <td><select class="g"><option value=""></option><option ${ex["年級"] == "4年級" ? "selected" : ""}>4年級</option><option ${ex["年級"] == "5年級" ? "selected" : ""}>5年級</option><option ${ex["年級"] == "6年級" ? "selected" : ""}>6年級</option></select></td>
          <td><input class="c" value="${esc(ex["班級"] || "")}" placeholder="4年1班"></td>
          <td><input class="nm" value="${esc(ex["姓名"] || "")}" placeholder="姓名"></td>
          <td><input class="rec" value="${esc(ex["紀錄"] || "")}" placeholder="秒 / 公尺" style="min-width:90px"></td>
          <td class="sc">${CONFIG.scoreTable[rank - 1]}</td></tr>`;
      }
      html += '</tbody></table></div>';
      html += `<div class="row" style="margin-top:14px">
        <button class="btn" id="saveBtn" type="button">儲存成績</button>
        <button class="btn red" id="delBtn" type="button">清除此項成績</button>
        <span class="muted">儲存會覆蓋此項目原有成績。</span></div>`;
      el("area").innerHTML = html;

      el("area").querySelectorAll("tr[data-rank]").forEach(function (tr) {
        tr.querySelector(".pick").addEventListener("change", function () {
          const v = this.value;
          if (v === "") return;
          const r = REG[Number(v)];
          tr.querySelector(".g").value = r["年級"] || "";
          tr.querySelector(".c").value = r["班級"] || "";
          tr.querySelector(".nm").value = r["姓名"] || "";
        });
      });
      el("saveBtn").addEventListener("click", () => save(code));
      el("delBtn").addEventListener("click", () => del(code));
    }

    async function save(code) {
      const rows = [];
      el("area").querySelectorAll("tr[data-rank]").forEach(function (tr) {
        const cls = tr.querySelector(".c").value.trim();
        const nm = tr.querySelector(".nm").value.trim();
        if (!cls && !nm) return;                    // 空白列略過
        rows.push({ 名次: Number(tr.dataset.rank), 年級: tr.querySelector(".g").value, 班級: cls, 姓名: nm, 紀錄: tr.querySelector(".rec").value.trim() });
      });
      if (!rows.length) return toast("請至少填一列成績", "err");
      const btn = el("saveBtn"); setBusy(btn, true, "儲存中…");
      try {
        const res = await apiPost("submitScore", { token: AUTH.token, code, rows });
        toast(res.msg, "ok");
      } catch (e) {
        toast(e.message, "err");
        if (/登入/.test(e.message)) { clearAuth(); location.reload(); }
      } finally { setBusy(btn, false); }
    }

    async function del(code) {
      if (!confirm("確定要清除此項目的所有成績嗎？")) return;
      try {
        const res = await apiPost("deleteScore", { token: AUTH.token, code });
        toast(res.msg, "ok");
        onPickEvent();
      } catch (e) { toast(e.message, "err"); }
    }

    /* ---- Excel 匯入成績 ---- */
    let IMP_ROWS = [];
    function normGrade(g){ g=String(g).trim(); return /年級/.test(g)?g:(g?g+"年級":""); }
    function findEvent(name, grade, sex){
      name=String(name).trim(); grade=normGrade(grade); sex=String(sex).trim();
      const m = EVENTS.filter(e => String(e["名稱"]).trim()===name
        && (String(e["組別"])===grade || String(e["組別"])==="全校")
        && (String(e["性別"])===sex || String(e["性別"])==="混合"));
      return m.length===1 ? m[0] : null;
    }
    function readSheetFile(file){
      return new Promise(function(resolve,reject){
        const fr=new FileReader();
        fr.onload=function(e){ try{ const wb=XLSX.read(e.target.result,{type:"array"});
          resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""})); }catch(err){reject(err);} };
        fr.onerror=reject; fr.readAsArrayBuffer(file);
      });
    }
    async function onScoreFile(ev){
      const f=ev.target.files[0]; if(!f) return;
      let raw; try{ raw=await readSheetFile(f); }catch(e){ return toast("讀檔失敗："+e.message,"err"); }
      IMP_ROWS = raw.map(function(r){
        const 名稱=r["項目名稱"]||r["項目"], 組別=r["組別"]||r["年級"], 性別=r["性別"], 名次=r["名次"], 班級=r["班級"], 姓名=r["姓名"], 紀錄=r["紀錄"]||r["成績"]||"";
        const e=findEvent(名稱, 組別, 性別);
        return {名稱,組別:normGrade(組別),性別,名次,班級:String(班級||""),姓名:String(姓名||""),紀錄:String(紀錄||""),
                代碼: e?e["代碼"]:"", ok: !!e && !!Number(名次)};
      }).filter(r=>r.名稱 || r.班級);
      renderImpPreview();
    }
    function renderImpPreview(){
      const box=el("s_preview");
      if(!IMP_ROWS.length){ box.innerHTML='<div class="error">讀不到有效資料，請檢查欄位標題。</div>'; return; }
      const bad=IMP_ROWS.filter(r=>!r.ok).length;
      const rows=IMP_ROWS.map(function(r){
        const cls=r.ok?'':'style="background:#fdecea"';
        const st=r.ok?'OK':(!r.代碼?'<span class="rank1">找不到項目</span>':'<span class="rank1">名次無效</span>');
        return `<tr ${cls}><td>${esc(r.名稱)}</td><td>${esc(r.組別)} ${esc(r.性別)}</td><td>${esc(r.名次)}</td>
          <td>${esc(r.班級)}</td><td>${esc(r.姓名)}</td><td>${esc(r.紀錄)}</td><td>${st}</td></tr>`;
      }).join("");
      box.innerHTML=`<div class="notice">共 ${IMP_ROWS.length} 筆，可匯入 <b>${IMP_ROWS.length-bad}</b> 筆${bad?('，<b class="rank1">'+bad+'</b> 筆有問題（不匯入）'):''}。</div>
        <div class="table-wrap"><table><thead><tr><th>項目</th><th>組別</th><th>名次</th><th>班級</th><th>姓名</th><th>紀錄</th><th>狀態</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <div style="margin-top:12px"><button class="btn" id="s_import" type="button">確認匯入</button></div>`;
      el("s_import").addEventListener("click", doScoreImport);
    }
    async function doScoreImport(){
      const rows=IMP_ROWS.filter(r=>r.ok).map(r=>({代碼:r.代碼,名次:r.名次,年級:r.組別,班級:r.班級,姓名:r.姓名,紀錄:r.紀錄}));
      if(!rows.length) return toast("沒有可匯入的成績","err");
      const b=el("s_import"); setBusy(b,true,"匯入中…");
      try{
        const res=await apiPost("importScores",{token:AUTH.token, rows});
        toast("匯入完成：新增 "+res.added+" 筆成績","ok");
        el("s_preview").innerHTML += '<div class="notice">✅ 已匯入 '+res.added+' 筆。</div>';
      }catch(e){ toast(e.message,"err"); if(/登入/.test(e.message)){clearAuth();location.reload();} }
      finally{ setBusy(b,false); }
    }
    function downloadScoreTemplate(){
      const ws=XLSX.utils.aoa_to_sheet([
        ["項目名稱","組別","性別","名次","班級","姓名","紀錄"],
        ["100公尺","5年級","男","1","5年1班","王小明","13.2秒"],
        ["100公尺","5年級","男","2","5年3班","李大同","13.8秒"],
        ["跳遠","5年級","女","1","5年2班","林小美","3.25公尺"]
      ]);
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"成績"); XLSX.writeFile(wb,"成績匯入範例.xlsx");
    }

    el("loginBtn").addEventListener("click", login);
    el("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    el("logoutBtn").addEventListener("click", () => { clearAuth(); location.reload(); });
    el("code").addEventListener("change", onPickEvent);
    el("s_file").addEventListener("change", onScoreFile);
    el("s_tpl").addEventListener("click", downloadScoreTemplate);
    el("p_refresh").addEventListener("click", loadProgress);

    loadAuth();
    document.addEventListener("DOMContentLoaded", function () {
      if (AUTH && AUTH.token) showPanel();
      else initGoogle();
    });
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  </script>
</body>
</html>
