<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秩序冊產生 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    .prog-table { margin: 10px 0 18px; }
    .prog-table th, .prog-table td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
    .prog-table td.lbl { font-weight: 700; background: #faf6ee; white-space: nowrap; }
    .prog-event { margin-bottom: 22px; padding-bottom: 10px; border-bottom: 2px dashed var(--line); }
    .prog-event h3 { color: var(--gold-d); margin-bottom: 6px; }
    .prog-cover { text-align: center; margin-bottom: 24px; }
    .order-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
    .order-item button { padding: 2px 10px; }
    @media print {
      .site-header, .site-nav, .site-footer, .no-print, #loginCard { display: none !important; }
      .prog-event { page-break-after: always; border-bottom: none; }
      body { background: #fff; }
    }
  </style>
</head>
<body data-page="program">
  <main>
    <!-- 登入 -->
    <section class="card" id="loginCard">
      <h2>秩序冊產生登入</h2>
      <p class="muted">體育老師請用學校 <b>Google 帳號一鍵登入</b>（須先由管理員加入試算表「授權」分頁）。</p>
      <div id="gbtn"></div>
      <div id="gTip" class="muted" style="font-size:13px;margin-top:8px"></div>
      <details style="margin-top:18px">
        <summary style="cursor:pointer;font-weight:600;color:var(--gold-d)">改用管理者帳號 / 密碼登入</summary>
        <div class="grid2" style="margin-top:10px">
          <div><label>帳號 (Email)</label><input id="email" placeholder="admin@youchang" autocomplete="username"></div>
          <div><label>密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
        </div>
        <div style="margin-top:14px"><button class="btn ghost" id="loginBtn" type="button">登入</button></div>
      </details>
      <div id="loginMsg"></div>
    </section>

    <!-- 已登入 -->
    <section class="card no-print" id="panel" style="display:none">
      <h2>秩序冊產生</h2>
      <div class="row" style="justify-content:space-between">
        <div class="muted">已登入：<b id="who"></b></div>
        <button class="btn ghost" id="logoutBtn" type="button">登出</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
      <label>年級</label>
      <select id="grade"><option value="">請選擇</option><option>4年級</option><option>5年級</option><option>6年級</option></select>
      <div id="loadArea" style="margin-top:10px"></div>
    </section>

    <!-- 分道抽籤順序 -->
    <section class="card no-print" id="drawCard" style="display:none">
      <h2>短跑分道抽籤順序</h2>
      <p class="muted">60/100/200 公尺會依此順序，每 <b id="laneTip">4</b> 班一組排道次（比照往年紙本抽籤方式）。
        請用 ▲▼ 調整成實際抽籤結果，或按「隨機排序」由系統代抽。跳高/跳遠/壘球擲遠與接力類不受此順序影響，一律依班級序排列。</p>
      <div class="row">
        <button class="btn ghost" id="shuffleBtn" type="button">隨機排序</button>
        <button class="btn ghost" id="resetOrderBtn" type="button">依班級序重設</button>
      </div>
      <div id="orderList" style="margin-top:12px"></div>
    </section>

    <!-- 產生 / 列印 -->
    <section class="card no-print" id="genCard" style="display:none">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">產生秩序冊</h2>
        <div class="row">
          <button class="btn ghost" id="genBtn" type="button">產生 / 重新產生</button>
          <button class="btn" id="printBtn" type="button" style="display:none">🖨 列印 / 存成 PDF</button>
        </div>
      </div>
      <p class="muted">請先確認上方抽籤順序再產生；順序若有更改，需重新按一次「產生」。</p>
    </section>

    <section id="bookletArea"></section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const AUTH_KEY = "yc_auth";
    const USABLE_LANES = 4;
    const LANE_COLORS = ["藍", "綠", "黃", "紅", "橘", "白"];
    const SPRINT = ["60公尺", "100公尺", "200公尺"];
    const FIELD = ["跳高", "跳遠", "壘球擲遠"];
    const RELAY = ["400公尺接力", "大隊接力", "體育班大隊接力"];
    let AUTH = null, EVENTS = [], REGS = [], CLASS_ORDER = [];

    function loadAuth() { try { AUTH = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { AUTH = null; } }
    function saveAuth(a) { AUTH = a; localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
    function clearAuth() { AUTH = null; localStorage.removeItem(AUTH_KEY); if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); }

    /* ---- 登入（與 score.html 同款） ---- */
    function initGoogle(tries) {
      tries = tries || 0;
      if (!CONFIG.GOOGLE_CLIENT_ID) { el("gTip").innerHTML = "（尚未設定 Google 登入，請用下方管理者帳密登入。）"; return; }
      if (!window.google || !google.accounts || !google.accounts.id) {
        if (tries < 20) return setTimeout(function () { initGoogle(tries + 1); }, 300);
        el("gTip").innerHTML = "（Google 登入元件載入失敗，請改用下方管理者帳密。）"; return;
      }
      google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onGoogleCred });
      google.accounts.id.renderButton(el("gbtn"), { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill", locale: "zh_TW", width: 280 });
    }
    async function onGoogleCred(resp) {
      el("gTip").textContent = "驗證中…";
      try { const res = await apiPost("googleLogin", { credential: resp.credential }); saveAuth(res); el("loginMsg").innerHTML = ""; el("gTip").textContent = ""; showPanel(); toast("登入成功：" + res.name, "ok"); }
      catch (e) { el("gTip").textContent = ""; el("loginMsg").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }
    async function login() {
      const email = el("email").value.trim(), pw = el("pw").value;
      if (!email || !pw) return toast("請輸入帳號與密碼", "err");
      const btn = el("loginBtn"); setBusy(btn, true, "登入中…");
      try { const res = await apiPost("login", { email, password: pw }); saveAuth(res); el("loginMsg").innerHTML = ""; showPanel(); toast("登入成功", "ok"); }
      catch (e) { el("loginMsg").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
      finally { setBusy(btn, false); }
    }
    function showPanel() {
      el("loginCard").style.display = "none";
      el("panel").style.display = "block";
      el("who").textContent = AUTH.name + "（" + (AUTH.role === "admin" ? "管理者" : "老師") + "）";
    }

    /* ---- 選年級 → 載入項目/報名 ---- */
    function classNum(c) { const m = String(c).match(/(\d+)年(\d+)班/); return m ? Number(m[2]) : 999; }
    function classCompare(a, b) { return classNum(a) - classNum(b); }

    async function onGradeChange() {
      const grade = el("grade").value;
      el("drawCard").style.display = "none";
      el("genCard").style.display = "none";
      el("printBtn").style.display = "none";
      el("bookletArea").innerHTML = "";
      if (!grade) { el("loadArea").innerHTML = ""; return; }
      el("loadArea").innerHTML = '<p class="muted">載入中…</p>';
      try {
        const [evD, regD] = await Promise.all([apiGet("events", { grade }), apiGet("reglist", { grade })]);
        EVENTS = evD.events; REGS = regD.regs;
        el("loadArea").innerHTML = `<div class="notice">共 ${EVENTS.length} 個項目，${REGS.length} 筆報名資料。</div>`;
        const classes = Array.from(new Set(REGS.map(r => r["班級"]))).filter(Boolean);
        classes.sort(classCompare);
        CLASS_ORDER = classes;
        if (!classes.length) { el("loadArea").innerHTML += '<div class="error">此年級目前尚無報名資料，無法產生秩序冊。</div>'; return; }
        renderOrderList();
        el("drawCard").style.display = "block";
        el("genCard").style.display = "block";
      } catch (e) { el("loadArea").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }

    /* ---- 分道抽籤順序 ---- */
    function renderOrderList() {
      el("laneTip").textContent = USABLE_LANES;
      const box = el("orderList");
      box.innerHTML = CLASS_ORDER.map(function (c, i) {
        const batch = Math.floor(i / USABLE_LANES);
        const color = LANE_COLORS[i % USABLE_LANES] || (i % USABLE_LANES + 1);
        return `<div class="order-item">
          <span class="muted" style="width:110px">第${batch + 1}批 · ${color}道</span>
          <b style="flex:1">${esc(c)}</b>
          <button class="btn ghost" type="button" data-act="up" data-i="${i}" ${i === 0 ? "disabled" : ""}>▲</button>
          <button class="btn ghost" type="button" data-act="down" data-i="${i}" ${i === CLASS_ORDER.length - 1 ? "disabled" : ""}>▼</button>
        </div>`;
      }).join("");
      box.querySelectorAll("button[data-act]").forEach(function (b) {
        b.addEventListener("click", function () {
          const i = Number(b.dataset.i), j = b.dataset.act === "up" ? i - 1 : i + 1;
          const tmp = CLASS_ORDER[i]; CLASS_ORDER[i] = CLASS_ORDER[j]; CLASS_ORDER[j] = tmp;
          renderOrderList();
        });
      });
    }
    function shuffleOrder() {
      for (let i = CLASS_ORDER.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = CLASS_ORDER[i]; CLASS_ORDER[i] = CLASS_ORDER[j]; CLASS_ORDER[j] = tmp;
      }
      renderOrderList();
    }

    /* ---- 產生秩序冊 ---- */
    function regsForEvent(code) { return REGS.filter(function (r) { return r["項目代碼"] === code; }); }
    function groupByClass(rows) {
      const m = {};
      rows.forEach(function (r) { const c = r["班級"]; (m[c] || (m[c] = [])).push(r); });
      Object.keys(m).forEach(function (c) { m[c].sort(function (a, b) { return Number(a["座號"]) - Number(b["座號"]); }); });
      return m;
    }
    function chunk(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }
    function cnNum(n) { const cn = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"]; return cn[n - 1] || n; }

    function renderSprintEvent(ev) {
      const byClass = groupByClass(regsForEvent(ev["代碼"]));
      const batches = chunk(CLASS_ORDER, USABLE_LANES);
      let heatNum = 0, body = "";
      batches.forEach(function (batch) {
        const maxN = Math.max(0, ...batch.map(function (c) { return (byClass[c] || []).length; }));
        if (!maxN) return;
        body += `<table class="prog-table"><thead><tr><th>道次</th>${batch.map(function (c, i) {
          return `<th>${i + 1}<br><span class="muted" style="font-weight:400">${LANE_COLORS[i]}道</span></th>`;
        }).join("")}</tr></thead><tbody><tr><td class="lbl">班級</td>${batch.map(function (c) { return `<td>${esc(c)}</td>`; }).join("")}</tr>`;
        for (let i = 0; i < maxN; i++) {
          heatNum++;
          body += `<tr><td class="lbl">第${cnNum(heatNum)}組</td>${batch.map(function (c) {
            const s = (byClass[c] || [])[i]; return `<td>${s ? esc(s["姓名"]) : ""}</td>`;
          }).join("")}</tr>`;
        }
        body += `</tbody></table>`;
      });
      if (!body) return "";
      return `<div class="prog-event"><h3>${esc(ev["名稱"])}（${esc(ev["組別"])} ${esc(ev["性別"])}）</h3>${body}</div>`;
    }
    function renderFieldEvent(ev) {
      const rows = regsForEvent(ev["代碼"]);
      if (!rows.length) return "";
      const byClass = groupByClass(rows);
      const classes = Object.keys(byClass).sort(classCompare);
      const list = [];
      classes.forEach(function (c) { byClass[c].forEach(function (s) { list.push({ cls: c, name: s["姓名"] }); }); });
      const trs = list.map(function (s, i) { return `<tr><td>${i + 1}</td><td>${esc(s.cls)}</td><td>${esc(s.name)}</td></tr>`; }).join("");
      return `<div class="prog-event"><h3>${esc(ev["名稱"])}（${esc(ev["組別"])} ${esc(ev["性別"])}）</h3>
        <table class="prog-table"><thead><tr><th>編號</th><th>班級</th><th>姓名</th></tr></thead><tbody>${trs}</tbody></table></div>`;
    }
    function renderRelayEvent(ev) {
      const rows = regsForEvent(ev["代碼"]);
      if (!rows.length) return "";
      const byClass = groupByClass(rows);
      const classes = Object.keys(byClass).sort(classCompare);
      const blocks = classes.map(function (c) {
        return `<div style="margin-bottom:8px"><b>${esc(c)}</b>：${byClass[c].map(function (s) { return esc(s["姓名"]); }).join("、")}</div>`;
      }).join("");
      return `<div class="prog-event"><h3>${esc(ev["名稱"])}（${esc(ev["組別"])} ${esc(ev["性別"])}）</h3>${blocks}</div>`;
    }

    function generateBooklet() {
      let html = `<div class="prog-cover"><h2>${esc(CONFIG.schoolName)} ${esc(CONFIG.eventTitle)}</h2><h3>${esc(el("grade").value)} 秩序冊</h3></div>`;
      let any = false;
      EVENTS.forEach(function (ev) {
        const name = ev["名稱"]; let piece = "";
        if (SPRINT.indexOf(name) >= 0) piece = renderSprintEvent(ev);
        else if (FIELD.indexOf(name) >= 0) piece = renderFieldEvent(ev);
        else if (RELAY.indexOf(name) >= 0) piece = renderRelayEvent(ev);
        if (piece) { html += piece; any = true; }
      });
      if (!any) { toast("此年級尚無可產生的報名資料", "err"); return; }
      el("bookletArea").innerHTML = html;
      el("printBtn").style.display = "inline-block";
      toast("秩序冊已產生", "ok");
    }

    el("loginBtn").addEventListener("click", login);
    el("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
    el("logoutBtn").addEventListener("click", function () { clearAuth(); location.reload(); });
    el("grade").addEventListener("change", onGradeChange);
    el("shuffleBtn").addEventListener("click", shuffleOrder);
    el("resetOrderBtn").addEventListener("click", function () { CLASS_ORDER.sort(classCompare); renderOrderList(); });
    el("genBtn").addEventListener("click", generateBooklet);
    el("printBtn").addEventListener("click", function () { window.print(); });

    loadAuth();
    document.addEventListener("DOMContentLoaded", function () {
      if (AUTH && AUTH.token) showPanel(); else initGoogle();
    });
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  </script>
</body>
</html>
