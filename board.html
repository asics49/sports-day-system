<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>即時成績公布 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261022d">
  <style>
    .board-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
    .board-bar > div { flex:1; min-width:150px; }
    .board-title { text-align:center; margin:6px 0 4px; }
    .board-title h2 { font-size:clamp(22px,4vw,40px); color:var(--gold-d); margin:0; justify-content:center; }
    .board-title h2::before { display:none; }
    .board-sub { text-align:center; color:var(--muted); margin-bottom:10px; font-size:clamp(13px,1.6vw,18px); }
    table.board { font-size:clamp(15px,2vw,26px); }
    table.board th { font-size:clamp(13px,1.5vw,20px); }
    table.board td, table.board th { padding:clamp(8px,1.4vw,18px) clamp(8px,1.2vw,16px); }
    .rk { font-weight:900; text-align:center; width:1%; white-space:nowrap; }
    .rk .medal { font-size:1.4em; }
    tr.top1 { background:#fff8e6; }
    tr.top2 { background:#f7f7f7; }
    tr.top3 { background:#fbf3ea; }
    .refresh-row { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:12px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
    .dot { width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block; animation:blink 1.4s infinite; }
    @keyframes blink { 50%{opacity:.25} }
    .fs-btn { cursor:pointer; }
    .done-wrap { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .done-wrap label { margin:0; font-weight:700; }
    .done-wrap select { flex:1; min-width:220px; max-width:420px; }
  </style>
</head>
<body data-page="board">
  <main>
    <section class="card">
      <div class="board-bar">
        <div>
          <label>年級</label>
          <select id="grade"><option value="">全部</option><option>4年級</option><option>5年級</option><option>6年級</option></select>
        </div>
        <div>
          <label>項目</label>
          <select id="code"><option value="">請選擇項目</option></select>
        </div>
        <div style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="btn ghost fs-btn" id="fsBtn" type="button">🔳 全螢幕</button>
        </div>
      </div>
      <div class="refresh-row">
        <label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="auto" checked style="width:auto"> 自動更新</label>
        <span><span class="dot"></span> 每 <b>15</b> 秒重新整理　下次：<b id="cd">–</b> 秒</span>
        <button class="btn ghost" id="now" type="button" style="padding:6px 14px">立即更新</button>
      </div>
      <div class="done-wrap" id="doneBox" style="display:none">
        <label for="doneSel">✅ 已完賽項目</label>
        <select id="doneSel"></select>
      </div>
    </section>

    <section class="card">
      <div class="board-title"><h2 id="bt">即時成績公布</h2></div>
      <div class="board-sub" id="bs">請選擇上方項目</div>
      <div id="out"></div>
    </section>
  </main>

  <script src="js/config.js?v=20261022d"></script>
  <script src="js/api.js?v=20261022d"></script>
  <script src="js/layout.js?v=20261022d"></script>
  <script>
    let EVENTS = [], timer = null, cd = 15, PICKED = false;   // PICKED＝使用者手動選過項目；沒選就自動顯示最近公布的項目

    (async function fillEvents() {
      try {
        const data = await apiGet("events");
        EVENTS = data.events;
        renderCodeOptions();
        load();
      } catch (e) { el("out").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    })();

    function renderCodeOptions() {
      const grade = el("grade").value;
      const sel = el("code"); const cur = sel.value;
      sel.innerHTML = '<option value="">請選擇項目</option>';
      EVENTS.filter(function (e) {
        return !grade || e["組別"] == grade || e["組別"] == "全校" || String(e["組別"]).indexOf(grade) >= 0;
      }).forEach(function (e) {
        const o = document.createElement("option");
        o.value = e["代碼"]; o.textContent = e["名稱"] + "（" + e["組別"] + " " + e["性別"] + "）";
        if (e["代碼"] == cur) o.selected = true;
        sel.appendChild(o);
      });
    }

    // 目前年級篩選下，最近公布成績的項目代碼
    function latestCode(results) {
      const grade = el("grade").value, ok = {};
      EVENTS.forEach(function (e) { if (!grade || e["組別"] == grade || e["組別"] == "全校" || String(e["組別"]).indexOf(grade) >= 0) ok[e["代碼"]] = true; });
      const last = {};
      results.forEach(function (r) { const t = new Date(r["時間"]).getTime() || 0, c = r["項目代碼"]; if (ok[c] && !(last[c] >= t)) last[c] = t; });
      const codes = Object.keys(last).sort(function (a, b) { return last[b] - last[a]; });
      return codes[0] || "";
    }

    // 已完賽（有成績）的項目，依最近公布時間排序，點選＝切換到該項目
    function renderDone(results) {
      const grade = el("grade").value, last = {};
      results.forEach(function (r) { const t = new Date(r["時間"]).getTime() || 0, c = r["項目代碼"]; if (!(last[c] >= t)) last[c] = t; });
      const list = EVENTS.filter(function (e) {
        return last[e["代碼"]] != null && (!grade || e["組別"] == grade || e["組別"] == "全校" || String(e["組別"]).indexOf(grade) >= 0);
      }).sort(function (a, b) { return last[b["代碼"]] - last[a["代碼"]]; });
      el("doneBox").style.display = list.length ? "" : "none";
      const cur = el("code").value;
      el("doneSel").innerHTML = '<option value="">請選擇已完賽項目（共 ' + list.length + ' 項）</option>' + list.map(function (e) {
        return `<option value="${esc(e["代碼"])}"${e["代碼"] == cur ? " selected" : ""}>${esc(e["名稱"])} ${esc(e["組別"])}${e["性別"] && e["性別"] !== "混合" ? " " + esc(e["性別"]) : ""}</option>`;
      }).join("");
    }

    async function load() {
      let data0 = null;
      try {
        data0 = await apiGet("query");
        if (!PICKED) { const c = latestCode(data0.results || []); if (c) el("code").value = c; }
        renderDone(data0.results || []);
      } catch (e) { /* 下面照一般流程顯示 */ }
      const code = el("code").value;
      if (!code) { el("bt").textContent = "即時成績公布"; el("bs").textContent = "請選擇上方項目"; el("out").innerHTML = ""; return; }
      const ev = EVENTS.find(function (e) { return e["代碼"] == code; }) || {};
      el("bt").textContent = ev["名稱"] || "成績";
      el("bs").textContent = (ev["組別"] || "") + "　" + (ev["性別"] || "");
      try {
        const data = data0 || await apiGet("query", { code });
        const TOPN = CONFIG.scoreTable.length;   // 公布頁只顯示有積分的名次（前 6 名）；完整成績到「成績查詢」
        const rows = data.results.filter(function (r) { var k = Number(r["名次"]); return r["項目代碼"] == code && k >= 1 && k <= TOPN; }).sort(function (a, b) { return (a["名次"] || 99) - (b["名次"] || 99); });
        if (!rows.length) { el("out").innerHTML = '<div class="notice" style="text-align:center;font-size:clamp(15px,2vw,22px)">此項目尚未公布成績</div>'; return; }
        const medal = ["🥇","🥈","🥉"];
        const body = rows.map(function (r) {
          const sp = r["紀錄"] === "棄權" || r["紀錄"] === "請假";
          const rk = sp ? 0 : Number(r["名次"]);
          const cls = rk >= 1 && rk <= 3 ? "top" + rk : "";
          const m = rk >= 1 && rk <= 3 ? '<span class="medal">' + medal[rk - 1] + '</span> ' : "";
          return `<tr class="${cls}">
            <td class="rk rank${rk>=1&&rk<=3?rk:''}">${sp ? esc(r["紀錄"]) : m + rk}</td>
            <td>${esc(r["班級"])}</td>
            <td>${esc(r["姓名"])}</td>
            <td>${sp ? "" : esc(r["紀錄"] || "")}</td>
            <td style="text-align:center">${esc(r["得分"])}</td></tr>`;
        }).join("");
        el("out").innerHTML = `<div class="table-wrap"><table class="board">
          <thead><tr><th class="rk">名次</th><th>班級</th><th>姓名</th><th>紀錄</th><th style="text-align:center">得分</th></tr></thead>
          <tbody>${body}</tbody></table></div>`;
      } catch (e) { el("out").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }

    function tick() {
      if (!el("auto").checked) { el("cd").textContent = "–"; return; }
      cd--; el("cd").textContent = cd;
      if (cd <= 0) { cd = 15; load(); }
    }

    el("grade").addEventListener("change", function () { renderCodeOptions(); if (!PICKED) el("code").value = ""; cd = 15; load(); });
    el("code").addEventListener("change", function () { PICKED = !!el("code").value; cd = 15; load(); });
    el("doneSel").addEventListener("change", function () {
      if (!this.value) return;
      el("code").value = this.value; PICKED = true; cd = 15; load();
    });
    el("now").addEventListener("click", function () { cd = 15; load(); });
    el("fsBtn").addEventListener("click", function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    });
    timer = setInterval(tick, 1000);

    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
