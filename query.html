<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成績查詢 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261022d">
</head>
<body data-page="query">
  <main>
    <section class="card">
      <h2>個人成績總覽</h2>
      <p class="muted">查「某一位學生」：輸入他的班級座號，列出他報名的每個項目，已公布/尚未公布都會顯示。</p>
      <div class="row">
        <div style="flex:1;min-width:120px">
          <label>年級</label>
          <select id="p_grade"><option value="">請選擇</option><option>4年級</option><option>5年級</option><option>6年級</option></select>
        </div>
        <div style="flex:1;min-width:120px">
          <label>班級</label>
          <input id="p_cls" placeholder="4年1班">
        </div>
        <div style="flex:1;min-width:100px">
          <label>座號</label>
          <input id="p_seat" inputmode="numeric" placeholder="15">
        </div>
        <div style="flex:1;min-width:120px">
          <label>姓名</label>
          <input id="p_name" placeholder="王小明">
        </div>
        <div><button class="btn" id="p_go" type="button">查詢</button></div>
      </div>
      <div id="p_out" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h2>依條件查詢名次</h2>
      <p class="muted">查「某個項目/班級」的成績：可篩選年級、項目、班級、姓名。項目只要已經公布成績，報名了卻沒有名次的選手會顯示「未達標」（棄權、請假者會標示原因）。</p>
      <div class="row">
        <div style="flex:1;min-width:150px">
          <label>年級</label>
          <select id="grade"><option value="">全部</option><option>4年級</option><option>5年級</option><option>6年級</option></select>
        </div>
        <div style="flex:1;min-width:150px">
          <label>項目</label>
          <select id="code"><option value="">全部項目</option></select>
        </div>
        <div style="flex:1;min-width:120px">
          <label>班級</label>
          <input id="cls" placeholder="4年1班">
        </div>
        <div style="flex:1;min-width:120px">
          <label>姓名</label>
          <input id="name" placeholder="王小明">
        </div>
        <div><button class="btn" id="go" type="button">查詢</button></div>
      </div>
    </section>

    <section class="card">
      <h2>查詢結果</h2>
      <div id="out"><p class="muted">請設定條件後按「查詢」。</p></div>
    </section>
  </main>

  <script src="js/config.js?v=20261022d"></script>
  <script src="js/api.js?v=20261022d"></script>
  <script src="js/layout.js?v=20261022d"></script>
  <script>
    let EVENTS = [];
    // 狀態說明：沒有名次紀錄的選手，在「已公布成績的項目」裡顯示「未達標」；棄權、請假（成績表的紀錄欄寫「棄權」「請假」）照實顯示
    const NOSHOW = ["棄權", "請假"];
    const isRelayName = n => /接力/.test(String(n || ""));
    const cKey = c => normalizeClassName(c);
    const sKey = (c, n) => cKey(c) + "|" + String(n || "").trim();
    function specialStatus(r) {   // 回傳「棄權」「請假」或 ""
      const t = String(r["紀錄"] || "").trim();
      return NOSHOW.indexOf(t) >= 0 ? t : "";
    }
    (async function fillEvents() {
      try {
        const data = await apiGet("events");
        EVENTS = data.events;
        const sel = el("code");
        data.events.forEach(function (e) {
          const o = document.createElement("option");
          o.value = e["代碼"]; o.textContent = e["名稱"] + "（" + e["組別"] + " " + e["性別"] + "）";
          sel.appendChild(o);
        });
      } catch (e) {}
    })();

    async function run() {
      const out = el("out"); out.innerHTML = '<p class="muted">查詢中…</p>';
      try {
        const fGrade = el("grade").value, fCode = el("code").value,
              fCls = cKey(el("cls").value.trim()), fName = el("name").value.trim();
        const [resD, regD, evD] = await Promise.all([apiGet("query"), apiGet("reglist"), EVENTS.length ? { events: EVENTS } : apiGet("events")]);
        EVENTS = evD.events;
        const results = resD.results, regs = regD.regs;
        const pass = r => (!fGrade || String(r["年級"]) === fGrade) && (!fCode || r["項目代碼"] == fCode) &&
          (!fCls || cKey(r["班級"]) === fCls) && (!fName || String(r["姓名"] || "").indexOf(fName) >= 0);
        const done = {};   // 已公布成績的項目
        results.forEach(r => { done[r["項目代碼"]] = true; });
        const rows = [];
        results.filter(pass).forEach(function (r) {
          const sp = specialStatus(r), rk = Number(r["名次"]);
          rows.push({ code: r["項目代碼"], name: r["項目名稱"], grp: r["組別"], cls: r["班級"], who: r["姓名"], seat: 0,
            rank: sp || !rk ? 999 : rk, label: sp || (rk ? rk : "—"), rec: sp ? "" : (r["紀錄"] || ""), pts: r["得分"], css: rk && !sp && rk <= 3 ? "rank" + rk : "" });
        });
        // 報名了、項目已公布成績、卻沒有名次紀錄的人 → 未達標
        const has = {}, hasClass = {};
        results.forEach(r => { has[r["項目代碼"] + "|" + sKey(r["班級"], r["姓名"])] = true; hasClass[r["項目代碼"] + "|" + cKey(r["班級"])] = true; });
        const relayDone = {};
        regs.forEach(function (g) {
          const code = g["項目代碼"]; if (!done[code]) return;
          const ev = EVENTS.find(e => e["代碼"] == code) || {};
          if (!pass({ "年級": g["年級"], "項目代碼": code, "班級": g["班級"], "姓名": g["姓名"] })) return;
          const relay = isRelayName(g["項目名稱"] || ev["名稱"]);
          if (relay) {   // 接力以班級為單位，一班只列一次
            const k = code + "|" + cKey(g["班級"]);
            if (hasClass[k] || relayDone[k]) return; relayDone[k] = true;
            rows.push({ code, name: g["項目名稱"], grp: ev["組別"] || g["年級"], cls: g["班級"], who: "（全班）", seat: 0, rank: 1000, label: "未達標", rec: "", pts: 0, css: "muted" });
            return;
          }
          if (has[code + "|" + sKey(g["班級"], g["姓名"])]) return;
          rows.push({ code, name: g["項目名稱"], grp: ev["組別"] || g["年級"], cls: g["班級"], who: g["姓名"], seat: Number(g["座號"]) || 0, rank: 1000, label: "未達標", rec: "", pts: 0, css: "muted" });
        });
        if (!rows.length) { out.innerHTML = '<div class="notice">查無成績。</div>'; return; }
        const ord = c => { const i = EVENTS.findIndex(e => e["代碼"] == c); return i < 0 ? 999 : i; };
        rows.sort((a, b) => ord(a.code) - ord(b.code) || a.rank - b.rank || normalizeClassName(a.cls).localeCompare(normalizeClassName(b.cls), "zh", { numeric: true }) || a.seat - b.seat);
        const nOk = rows.filter(r => r.rank < 999).length, nNo = rows.filter(r => r.label === "未達標").length;
        const body = rows.map(r => `<tr>
            <td>${esc(r.name)}</td><td>${esc(r.grp)}</td>
            <td class="${r.css}">${esc(r.label)}</td><td>${esc(r.cls)}</td>
            <td>${esc(r.who)}</td><td>${esc(r.rec)}</td><td style="text-align:center">${esc(r.pts)}</td></tr>`).join("");
        out.innerHTML = `<div class="notice">共 ${rows.length} 筆：有名次 ${nOk} 筆、未達標 ${nNo} 筆${rows.length - nOk - nNo ? "、棄權／請假 " + (rows.length - nOk - nNo) + " 筆" : ""}。</div>
          <div class="table-wrap"><table>
          <thead><tr><th>項目</th><th>組別</th><th>名次</th><th>班級</th><th>姓名</th><th>紀錄</th><th>得分</th></tr></thead>
          <tbody>${body}</tbody></table></div>`;
      } catch (e) { out.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }
    el("go").addEventListener("click", run);

    /* ---- 個人成績總覽 ---- */
    // 沒選年級時，從班級推出年級（「6年1班」→「6年級」）；後端 student 查詢的年級必須完全相符
    function gradeFromClass(c) {
      const m = String(c || "").match(/^(\d+)年/);
      return m ? m[1] + "年級" : "";
    }
    async function personalOverview() {
      const cls = el("p_cls").value.trim(),
            seat = el("p_seat").value.trim(), name = el("p_name").value.trim();
      const grade = el("p_grade").value || gradeFromClass(cls);
      const box = el("p_out");
      if (!cls || !seat) { toast("請至少填班級與座號", "err"); return; }
      if (!grade) { toast("請選擇年級，或把班級填成「6年1班」這種格式", "err"); return; }
      box.innerHTML = '<p class="muted">查詢中…</p>';
      try {
        const [regData, resData] = await Promise.all([
          apiGet("student", { grade, cls, seat }),
          apiGet("query"),
        ]);
        if (!regData.regs.length) { box.innerHTML = '<div class="notice">查無此生的報名紀錄，請確認年級/班級/座號是否正確。</div>'; return; }
        // 用報名資料裡的姓名精準過濾，避免把同班同學同項目的成績當成本人的；接力以班級為單位
        const myName = String(regData.regs[0]["姓名"] || "").trim(), myCls = cKey(regData.regs[0]["班級"] || cls);
        const done = {}, byCode = {};
        resData.results.forEach(function (r) {
          done[r["項目代碼"]] = true;
          if (cKey(r["班級"]) !== myCls) return;
          if (isRelayName(r["項目名稱"]) || String(r["姓名"]).trim() === myName) byCode[r["項目代碼"]] = r;
        });
        const rows = regData.regs.map(function (r) {
          const res = byCode[r["項目代碼"]];
          if (!res) {
            if (done[r["項目代碼"]]) return { 項目: r["項目名稱"], 類別: r["類別"], 狀態: '<span style="font-weight:700;color:var(--muted)">未達標</span>', 名次: "未達標", 紀錄: "", 得分: 0 };
            return { 項目: r["項目名稱"], 類別: r["類別"], 狀態: '<span class="muted">尚未公布</span>', 名次: "", 紀錄: "", 得分: "" };
          }
          const sp = specialStatus(res), rk = Number(res["名次"]);
          if (sp) return { 項目: r["項目名稱"], 類別: r["類別"], 狀態: `<span style="font-weight:700;color:var(--muted)">${esc(sp)}</span>`, 名次: sp, 紀錄: "", 得分: 0 };
          const badge = rk <= 3 ? "rank" + rk : "";
          return { 項目: r["項目名稱"], 類別: r["類別"],
            狀態: `<span class="${badge}" style="font-weight:700">第 ${rk} 名</span>`,
            名次: rk, 紀錄: res["紀錄"] || "", 得分: res["得分"] };
        });
        const doneN = rows.filter(r => r.名次 !== "").length;
        const trs = rows.map(r => `<tr><td>${esc(r.項目)}</td><td>${esc(r.類別)}</td><td>${r.狀態}</td><td>${esc(r.紀錄)}</td><td style="text-align:center">${esc(r.得分)}</td></tr>`).join("");
        box.innerHTML = `<div class="notice">共報名 ${rows.length} 項，已公布成績 ${doneN} 項（含未達標、棄權、請假）。</div>
          <div class="table-wrap"><table><thead><tr><th>項目</th><th>類別</th><th>狀態</th><th>紀錄</th><th>得分</th></tr></thead>
          <tbody>${trs}</tbody></table></div>`;
      } catch (e) { box.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }
    el("p_go").addEventListener("click", personalOverview);

    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
