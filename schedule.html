<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>賽事行事曆 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261022d">
  <style>
    /* 工具列 */
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .chip.on { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 700; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; color: var(--muted); }
    .seg button.on { background: var(--ink); color: #fff; }
    .legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: -4px 0 14px; }
    .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--tc); margin-right: 5px; vertical-align: -1px; }

    /* 時間軸 */
    .month-h { font-size: 18px; font-weight: 800; color: var(--gold-d); margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
    .month-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .tl-day { display: grid; grid-template-columns: 74px 1fr; gap: 14px; position: relative; padding-bottom: 14px; scroll-margin-top: 80px; }
    .tl-day::before { content: ""; position: absolute; left: 36px; top: 70px; bottom: 0; width: 2px; background: var(--line); }
    .tl-day:last-child::before { display: none; }
    .bubble { width: 74px; height: 70px; border-radius: 14px; background: #fff; border: 2px solid var(--gold); text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .bubble .md { font-size: 22px; font-weight: 800; color: var(--gold-d); line-height: 1.1; }
    .bubble .wd { font-size: 12px; color: var(--muted); }
    .bubble.wkend .wd { color: var(--red); }
    .tl-day.today .bubble { background: var(--gold); border-color: var(--gold); }
    .tl-day.today .bubble .md, .tl-day.today .bubble .wd { color: #fff; }
    .tl-day.past { opacity: .5; }
    .cards { display: grid; gap: 10px; min-width: 0; }
    .ev-card { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--tc); border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(120,90,30,.06); }
    .ev-card.next { box-shadow: 0 0 0 3px rgba(217,154,43,.35), 0 4px 14px rgba(120,90,30,.12); }
    .ev-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 17px; }
    .ev-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--tb); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto; }
    .gbadge { font-size: 12px; font-weight: 700; color: var(--tc); background: var(--tb); border-radius: 999px; padding: 1px 9px; }
    .tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
    .tag.next { background: var(--red); color: #fff; }
    .tag.done { background: #eee; color: #888; }
    .ev-meta { display: flex; gap: 4px 16px; flex-wrap: wrap; color: #5d564f; font-size: 14px; margin-top: 6px; }
    .ev-note { margin-top: 6px; font-size: 13px; color: var(--muted); background: #faf7f1; border-radius: 8px; padding: 5px 10px; }

    /* 月曆 */
    .cal { margin-bottom: 22px; }
    .cal-h { font-size: 18px; font-weight: 800; color: var(--gold-d); margin: 4px 0 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); gap: 1px; }
    .cal-wd { background: #faf5ec; text-align: center; font-size: 13px; font-weight: 700; padding: 6px 0; color: var(--muted); }
    .cal-wd.we { color: var(--red); }
    .cal-cell { background: #fff; min-height: 92px; padding: 4px 5px; min-width: 0; }
    .cal-cell.out { background: #fbf9f5; }
    .cal-cell.we { background: #fffaf7; }
    .cal-cell .dn { display: inline-block; font-size: 13px; font-weight: 700; color: #9a928a; }
    .cal-cell.today { box-shadow: inset 0 0 0 2px var(--gold); }
    .cal-cell.today .dn { color: #fff; background: var(--gold); border-radius: 999px; padding: 0 6px; }
    .cal-cell.past .ev-chip { opacity: .5; }
    .ev-chip { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; font: inherit; margin-top: 3px; padding: 2px 6px; border-radius: 6px;
      background: var(--tb); color: var(--tc); font-size: 12px; font-weight: 700; line-height: 1.35; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
    .ev-chip:hover { filter: brightness(.96); }

    @media (max-width: 640px) {
      .tl-day { grid-template-columns: 58px 1fr; gap: 10px; }
      .tl-day::before { left: 28px; top: 60px; }
      .bubble { width: 58px; height: 60px; }
      .bubble .md { font-size: 18px; }
      .cal-cell { min-height: 64px; padding: 3px; }
      .ev-chip { font-size: 0; padding: 2px 0; text-align: center; display: block; }   /* 手機上只顯示圖示 */
      .ev-chip .ci { font-size: 13px; }
    }
  </style>
</head>
<body data-page="schedule">
  <main>
    <div id="nextBox"></div>
    <section class="card">
      <h2>賽事行事曆</h2>
      <p class="muted">校慶運動會各項目的比賽日期、時間與地點。可以只看自己的年級，或切換月曆／時間軸。</p>
      <div class="toolbar">
        <div class="chips" id="gradeChips"></div>
        <div class="seg"><button type="button" data-v="list">☰ 時間軸</button><button type="button" data-v="cal">📅 月曆</button></div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="out"><p class="muted">載入中…</p></div>
    </section>
  </main>

  <script src="js/config.js?v=20261022d"></script>
  <script src="js/api.js?v=20261022d"></script>
  <script src="js/layout.js?v=20261022d"></script>
  <script src="js/sched.js?v=20261022d"></script>
  <script>
    const WD = SCHED_WD, TYPES = SCHED_TYPES, gradeLabel = schedGradeLabel;
    function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

    let ALL = [], GRADE = store("yc_sched_grade") || "", VIEW = store("yc_sched_view") || (innerWidth < 640 ? "list" : "cal");
    const TODAY = schedToday();

    async function run() {
      try {
        const data = await apiGet("schedule");
        ALL = prepSchedule(data.schedule);
        if (!ALL.length) { el("out").innerHTML = '<div class="notice">尚未公布賽事行事曆。</div>'; return; }
        buildChips(); buildLegend(); render();
      } catch (e) { el("out").innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }
    function rows() { return schedForGrade(ALL, GRADE); }
    const nextOf = schedNext;

    function buildChips() {
      const gs = new Set(); ALL.forEach(r => (r._g || []).forEach(g => gs.add(g)));
      const opts = [["", "全部"]].concat(Array.from(gs).sort().map(g => [String(g), g + " 年級"]));
      if (!opts.some(o => o[0] === GRADE)) GRADE = "";
      el("gradeChips").innerHTML = opts.map(o => `<button type="button" class="chip${o[0] === GRADE ? " on" : ""}" data-g="${o[0]}">${o[1]}</button>`).join("");
      el("gradeChips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
        GRADE = b.dataset.g; store("yc_sched_grade", GRADE);
        el("gradeChips").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render();
      }));
    }
    function buildLegend() {
      const used = new Set(ALL.map(r => r._t));
      el("legend").innerHTML = Object.keys(TYPES).filter(t => used.has(t)).map(t => `<span class="t-${t}">${TYPES[t].ico} ${TYPES[t].name}</span>`).join("");
    }
    document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { VIEW = b.dataset.v; store("yc_sched_view", VIEW); render(); }));

    function render() {
      document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.v === VIEW));
      const list = rows(), nx = nextOf(list);
      renderNext(nx, list);
      if (!list.length) { el("out").innerHTML = '<div class="notice">這個年級目前沒有賽程。</div>'; return; }
      el("out").innerHTML = VIEW === "cal" ? renderCal(list, nx) : renderList(list, nx);
      el("out").querySelectorAll(".ev-chip").forEach(c => c.addEventListener("click", () => {
        VIEW = "list"; store("yc_sched_view", VIEW); render();
        const t = document.getElementById("d-" + c.dataset.k); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      }));
    }

    function renderNext(nx, list) {
      el("nextBox").innerHTML = nextCardHtml(list, { gradeText: GRADE ? GRADE + " 年級" : "" });
    }

    function cardHtml(r, nx) {
      const past = r._k < TODAY, isNext = r === nx;
      return `<div class="ev-card t-${r._t}${isNext ? " next" : ""}">
        <div class="ev-title"><span class="ev-ico">${TYPES[r._t].ico}</span><span>${esc(r["項目"])}</span>
          <span class="gbadge">${esc(gradeLabel(r))}</span>${isNext ? '<span class="tag next">下一場</span>' : past ? '<span class="tag done">已結束</span>' : ""}</div>
        <div class="ev-meta">${r["時間"] ? `<span>🕗 ${esc(r["時間"])}</span>` : ""}${r["地點"] ? `<span>📍 ${esc(r["地點"])}</span>` : ""}
          ${r["檢錄時間"] ? `<span>📣 檢錄 ${esc(r["檢錄時間"])}</span>` : ""}</div>
        ${r["備註"] ? `<div class="ev-note">💬 ${esc(r["備註"])}</div>` : ""}</div>`;
    }
    function renderList(list, nx) {
      let html = "", month = -1;
      const keys = Array.from(new Set(list.map(r => r._k)));
      keys.forEach(k => {
        const items = list.filter(r => r._k === k), d = items[0]._d;
        if (d.getMonth() !== month) { month = d.getMonth(); html += `<div class="month-h">${d.getFullYear()} 年 ${month + 1} 月</div>`; }
        const cls = (k === TODAY ? " today" : "") + (k < TODAY ? " past" : "");
        html += `<div class="tl-day${cls}" id="d-${k}">
          <div class="bubble${d.getDay() % 6 === 0 ? " wkend" : ""}"><div class="md">${d.getMonth() + 1}/${d.getDate()}</div><div class="wd">${k === TODAY ? "今天" : "星期" + WD[d.getDay()]}</div></div>
          <div class="cards">${items.map(r => cardHtml(r, nx)).join("")}</div></div>`;
      });
      return html;
    }
    function renderCal(list, nx) {
      const byDay = {}; list.forEach(r => (byDay[r._k] || (byDay[r._k] = [])).push(r));
      const first = list[0]._d, last = list[list.length - 1]._d;
      let html = "";
      for (let y = first.getFullYear(), m = first.getMonth(); y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth()); m === 11 ? (y++, m = 0) : m++) {
        const start = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), lead = start.getDay();
        let cells = WD.map((w, i) => `<div class="cal-wd${i % 6 === 0 ? " we" : ""}">${w}</div>`).join("");
        const total = Math.ceil((lead + days) / 7) * 7;
        for (let i = 0; i < total; i++) {
          const dn = i - lead + 1;
          if (dn < 1 || dn > days) { cells += `<div class="cal-cell out"></div>`; continue; }
          const d = new Date(y, m, dn), k = schedDayKey(d), evs = byDay[k] || [];
          const cls = (d.getDay() % 6 === 0 ? " we" : "") + (k === TODAY ? " today" : "") + (k < TODAY ? " past" : "");
          cells += `<div class="cal-cell${cls}"><div class="dn">${dn}</div>${evs.map(r =>
            `<button type="button" class="ev-chip t-${r._t}" data-k="${k}" title="${esc(r["項目"] + "｜" + (r["時間"] || "") + "｜" + gradeLabel(r))}"><span class="ci">${TYPES[r._t].ico}</span> ${esc(r["項目"])}</button>`).join("")}</div>`;
        }
        html += `<div class="cal"><div class="cal-h">${y} 年 ${m + 1} 月</div><div class="cal-grid">${cells}</div></div>`;
      }
      return html + '<p class="muted" style="font-size:13px">點月曆上的項目可看詳細時間、地點與備註。</p>';
    }

    document.addEventListener("DOMContentLoaded", run);
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  </script>
</body>
</html>
