<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班級積分 · 右昌國小運動會</title>
  <link rel="icon" href="assets/banner-small.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261109e">
</head>
<body data-page="ranking">
  <main>
    <section class="card">
      <h2>班級積分排行榜</h2>
      <div class="row">
        <div style="min-width:160px">
          <label>年級</label>
          <select id="grade"><option value="">全部年級</option><option>4年級</option><option>5年級</option><option>6年級</option></select>
        </div>
        <div><button class="btn" id="go" type="button">重新整理</button></div>
      </div>
      <div id="out" style="margin-top:14px"><p class="muted">載入中…</p></div>
    </section>
  </main>

  <script src="js/config.js?v=20261109e"></script>
  <script src="js/api.js?v=20261109e"></script>
  <script src="js/layout.js?v=20261109e"></script>
  <script>
    async function run() {
      const out = el("out"); out.innerHTML = '<p class="muted">載入中…</p>';
      try {
        const data = await apiGet("ranking", { grade: el("grade").value });
        data.ranking = data.ranking.filter(function (r) { return ["4年級", "5年級", "6年級"].indexOf(String(r["年級"])) >= 0; });   // 1、2 年級不計班級積分
        if (!data.ranking.length) { out.innerHTML = '<div class="notice">尚無積分資料。</div>'; return; }
        const medal = ["🥇","🥈","🥉"];
        // 班級積分是各年級分開比（不同年級不互相排名）；同分並列同名次
        const grades = ["6年級", "5年級", "4年級"].filter(g => data.ranking.some(r => String(r["年級"]) === g));
        out.innerHTML = grades.map(function (g) {
          const list = data.ranking.filter(r => String(r["年級"]) === g).sort((a, b) => Number(b["總分"]) - Number(a["總分"]));
          const rows = list.map(function (r) {
            const rk = 1 + list.filter(o => Number(o["總分"]) > Number(r["總分"])).length;
            const cls = rk <= 3 ? "rank" + rk : "";
            return `<tr>
              <td class="${cls}" style="font-size:16px;width:64px">${medal[rk - 1] || rk}</td>
              <td>${esc(r["班級"])}</td>
              <td class="${cls}" style="font-weight:800">${esc(r["總分"])}</td>
              <td class="muted">${esc(r["場次"])}</td></tr>`;
          }).join("");
          return `<h3 style="margin:14px 0 6px">🏆 ${esc(g)}</h3><div class="table-wrap"><table>
            <thead><tr><th>名次</th><th>班級</th><th>總積分</th><th>得分場次</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`;
        }).join("");
      } catch (e) { out.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; }
    }
    el("go").addEventListener("click", run);
    document.addEventListener("DOMContentLoaded", run);
    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
